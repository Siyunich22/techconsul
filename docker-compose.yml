name: techocenka

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-techocenka}:${POSTGRES_PASSWORD:-techocenka}@postgres:5432/${POSTGRES_DB:-techocenka}
  TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-techocenka}:${POSTGRES_PASSWORD:-techocenka}@postgres:5432/${POSTGRES_DB:-techocenka}_test
  REDIS_URL: redis://redis:6379/0
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  EMBEDDER: ${EMBEDDER:-fastembed}
  WATCHFILES_FORCE_POLLING: "true"  # автоперезагрузка uvicorn на томах Windows/WSL
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-techocenka}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-techocenka-secret}
  S3_BUCKET: ${S3_BUCKET:-techocenka}
  JWT_SECRET: ${JWT_SECRET:-change-me}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL_ANALYSIS: ${LLM_MODEL_ANALYSIS:-claude-opus-5-5}
  LLM_MODEL_EXTRACT: ${LLM_MODEL_EXTRACT:-claude-sonnet-5-5}
  LLM_MODEL_CHEAP: ${LLM_MODEL_CHEAP:-claude-haiku-4-5-20251001}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techocenka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techocenka}
      POSTGRES_DB: ${POSTGRES_DB:-techocenka}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Официальные образы minio/minio сняты с Docker Hub/quay.io (см. docs/DECISIONS.md D-011).
  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-techocenka}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-techocenka-secret}
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Одноразовая инициализация: бакет + версионирование (файлы никогда не перезаписываются).
  minio-init:
    image: bitnamilegacy/minio:2025.5.24
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-techocenka}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-techocenka-secret}
      S3_BUCKET: ${S3_BUCKET:-techocenka}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1 && break;
      sleep 2; done &&
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc version enable local/$${S3_BUCKET}
      "
    restart: "no"

  # Перехват исходящей почты в dev: веб-интерфейс http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["${MAILPIT_SMTP_PORT:-1025}:1025", "${MAILPIT_UI_PORT:-8025}:8025"]

  api:
    build: ./backend
    image: techocenka-backend:dev  # один образ для api и воркеров
    environment: *backend-env
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["./backend:/app", "./templates:/templates:ro", "models:/models"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # разбор, OCR, LibreOffice, распаковка — параллельно
  worker:
    build: ./backend
    image: techocenka-backend:dev  # один образ для api и воркеров
    environment: *backend-env
    command: celery -A workers.celery_app worker -Q ingest,default --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-4} -n ingest@%h
    volumes: ["./backend:/app", "./templates:/templates:ro"]
    depends_on:
      api: {condition: service_healthy}

  # эмбеддинги: модель (~2 ГБ) загружена один раз, поэтому один процесс
  worker-index:
    build: ./backend
    image: techocenka-backend:dev  # один образ для api и воркеров
    environment: *backend-env
    command: celery -A workers.celery_app worker -Q index --loglevel=INFO --concurrency=1 -n index@%h
    volumes: ["./backend:/app", "./templates:/templates:ro", "models:/models"]
    depends_on:
      api: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports: ["${WEB_PORT:-3000}:3000"]
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:
  models:
