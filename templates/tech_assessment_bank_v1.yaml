# Формализация эталона: «Типовые требования к оценке технической проработанности и закупок
# инвестиционного проекта» (ред. 10.08.26). Источник истины для анализа, валидатора и рендера DOCX.
# Нумерация сохранена как в эталоне (включая отсутствие 3.6 — см. disabled-пункт ниже).

code: tech_assessment_bank_v1
title: "Оценка технической проработанности и закупок инвестиционного проекта"
language: ru

document_categories:
  договор_услуг: "Договор на оказание услуг"
  бизнес_план: "Бизнес-план"
  тэо_bfs: "ТЭО / Definitive FS / Bankable FS"
  псд: "Проектно-сметная документация"
  смета: "Сметы"
  финмодель: "Финансовая модель"
  кп_поставщиков: "Коммерческие предложения поставщиков"
  договоры_поставки: "Договоры поставки / подряда"
  техусловия: "Технические условия на подключение"
  экология: "ОВОС, экологические заключения и разрешения"
  правоустанавливающие: "Документы на землю и площадку"
  закупочные_процедуры: "Регламенты и протоколы закупок"
  прочее: "Другие документы"

expert_roles: [руководитель, технолог, энергетик, эколог, сметчик_закупки, логист]

sections:

  - id: "1"
    title: "Структура изложения материала"
    kind: info
    render: toc_and_structure   # генерируется автоматически из дерева пунктов

  - id: "2"
    title: "Общие данные"
    items:
      - id: "2.1"
        title: "Заказчик и исполнитель"
        kind: info
        fields: [customer_name, executor_name, affiliation, joint_experience]
        source: project.independence_json + organization
        requirement: >-
          Заказчик; Исполнитель; сведения об аффилированности Заказчика и Исполнителя;
          информация об опыте совместной деятельности Заказчика и Исполнителя.
      - id: "2.2"
        title: "Основание и исходные документы для проведения оценки"
        kind: info
        render: documents_table
        requirement: >-
          Договор на оказание услуг; бизнес-план, ТЭО, Definitive/Bankable feasibility study;
          проектно-сметная документация (при наличии); финансовая модель; другие документы.

  - id: "3"
    title: "Предмет оценки"
    intro: >-
      Оценка проработанности технико-технологических решений и закупок по проекту,
      оценка заявленной стоимости проекта (бюджет проекта).

    subsections:

      - id: "3.1"
        title: "Общая часть"
        expert_role: руководитель
        items:
          - id: "3.1.1"
            title: "Понятийный аппарат"
            kind: analysis
            tools: [project_docs]
            requirement: "Введение в понятийный аппарат."
            output_hints: {tables: ["Термины и определения, применяемые в отчёте"]}
          - id: "3.1.2"
            title: "Состав экспертов"
            kind: info
            source: project.members + experts
            requirement: >-
              Состав экспертов, задействованных в исследовании, с указанием сведений об образовании,
              наличии исследовательского опыта, контактные данные.
          - id: "3.1.3"
            title: "Принятые допущения"
            kind: analysis
            depends_on: ["3.2.*", "3.3.*", "3.4.*", "3.5.*", "3.7.*"]   # собирает assumptions из всех пунктов
            requirement: "Принятые допущения."
          - id: "3.1.4"
            title: "Примененные методики"
            kind: analysis
            requirement: "Примененные методики исследования технической части и стоимости закупок по проекту."
          - id: "3.1.5"
            title: "Источники информации и их оценка"
            kind: analysis
            depends_on: ["3.2.*", "3.3.*", "3.4.*", "3.5.*", "3.7.*"]
            inputs: [бизнес_план, тэо_bfs, псд, финмодель]
            requirement: >-
              Источники использованной информации. Оценка используемых источников информации Заказчиком.

      - id: "3.2"
        title: "Оценка проработки проекта в части выбора места реализации проекта, а также энергетической, транспортной, социальной инфраструктуры"
        expert_role: логист
        items:
          - id: "3.2.1"
            title: "Транспортная инфраструктура"
            kind: analysis
            inputs: [бизнес_план, тэо_bfs, псд, правоустанавливающие, смета]
            tools: [project_docs, web, calc]
            requirement: >-
              Оценка доступности транспортной инфраструктуры для обеспечения логистических процессов.
              Выводы о достаточности/недостаточности запланированных в проекте мероприятий и бюджета
              на обеспечение производства необходимой транспортной инфраструктурой.
          - id: "3.2.2"
            title: "Энергетическая инфраструктура и инженерные сети"
            kind: analysis
            extension: true     # дополнение по п. 5.1.6 эталона (заголовок 3.2 упоминает энергетику)
            expert_role: энергетик
            inputs: [техусловия, тэо_bfs, псд, смета]
            tools: [project_docs, web, calc]
            requirement: >-
              Оценка обеспеченности площадки электроэнергией, газом, водой, теплом, водоотведением:
              наличие ТУ, достаточность мощностей, расстояние до точек подключения, бюджет и сроки подключения.
          - id: "3.2.3"
            title: "Социальная инфраструктура и трудовые ресурсы"
            kind: analysis
            extension: true
            inputs: [бизнес_план, тэо_bfs]
            tools: [project_docs, web]
            requirement: >-
              Оценка наличия в районе площадки трудовых ресурсов необходимой квалификации, жилья,
              социальной инфраструктуры; предусмотренные проектом мероприятия.

      - id: "3.3"
        title: "Оценка проработки технологического решения"
        expert_role: технолог
        items:
          - id: "3.3.1"
            title: "Мировые технологии и сравнительный анализ"
            kind: analysis
            inputs: [тэо_bfs, бизнес_план]
            tools: [project_docs, web, reference]
            output_hints:
              tables: ["Сравнение выбранной технологии с мировыми аналогами: преимущества, недостатки, апробированность, конкурентоспособность, показатели эффективности, скорость устаревания"]
            requirement: >-
              Описание существующих в мире технологий. Сравнительный анализ выбранного по проекту
              технологического решения с существующими в мире технологиями с указанием преимуществ и
              недостатков, степени апробированности, конкурентоспособности, показателей эффективности,
              скорости устаревания и других характеристик с учетом специфики отрасли. Критерии,
              послужившие основанием для выбора технологического решения для реализации проекта.
          - id: "3.3.2"
            title: "Обоснованность выбора технологического решения"
            kind: analysis
            inputs: [тэо_bfs, финмодель, бизнес_план]
            tools: [project_docs, web, calc]
            output_hints:
              metrics: ["удельные капвложения на единицу продукции", "нормы расхода сырья", "энергопотребление", "потери и брак", "нормы рабочих часов"]
            requirement: >-
              Оценка обоснованности выбора технологического решения с точки зрения эффективности
              капитальных вложений на единицу продукции/услуг, достижения заявленных производственной
              мощности и объемов производства, соответствия качеству располагаемого сырья и материалов,
              себестоимости производства (нормы потребления сырья и материалов, энергопотребления,
              уровень потерь и брака, нормы рабочих часов производственного персонала и т.д.).
          - id: "3.3.3"
            title: "Технологическая схема и материальный баланс"
            kind: analysis
            inputs: [тэо_bfs, псд]
            tools: [project_docs, calc]
            output_hints:
              tables: ["Поэтапное описание процессов: параметры, ресурсы, сырьё, персонал", "Материальный баланс"]
              figures: ["Технологическая схема (из ПСД/ТЭО или блок-схема)"]
            requirement: >-
              Технологическая схема процесса(-ов) производства, поэтапное описание процессов с указанием
              технологических параметров, потребляемых ресурсов и сырья, вовлекаемого персонала, а также
              материального баланса.
          - id: "3.3.4"
            title: "Опыт промышленного применения"
            kind: analysis
            tools: [web, project_docs]
            output_hints: {tables: ["Референс-проекты: компания, страна, год, мощность, источник"]}
            requirement: >-
              Анализ опыта промышленного применения выбранной технологии, примеры реализации проектов
              с ее применением.
          - id: "3.3.5"
            title: "Выводы по технологии"
            kind: conclusion
            depends_on: ["3.3.1", "3.3.2", "3.3.3", "3.3.4"]
            tools: [web, project_docs]
            requirement: >-
              Выводы о целесообразности/нецелесообразности использования в проекте выбранных технологий,
              а также выводы о патентной чистоте данных технологий, их современности и экономичности.
          - id: "3.3.6"
            title: "Замечания, предложения, рекомендации"
            kind: remarks
            depends_on: ["3.3.1", "3.3.2", "3.3.3", "3.3.4", "3.3.5"]
            requirement: "Замечания, предложения, рекомендации по данной части проекта."

      - id: "3.4"
        title: "Оценка проектного оборудования"
        expert_role: технолог
        items:
          - id: "3.4.1"
            title: "Обоснованность выбора оборудования и поставщиков"
            kind: analysis
            inputs: [тэо_bfs, псд, кп_поставщиков, договоры_поставки]
            tools: [project_docs, web, calc]
            output_hints:
              tables: ["Сравнение по каждой единице основного оборудования: выбранное vs ≥3 альтернативы (производитель, страна, характеристики, стоимость, преимущества, недостатки)"]
              min_alternatives: 3
            requirement: >-
              Оценка обоснованности выбора основного технологического оборудования, поставщиков и
              производителей оборудования. Сравнительный анализ выбранного оборудования с альтернативными
              вариантами аналогичного оборудования (не менее 3-х), анализ преимуществ и недостатков,
              стоимости и технических характеристик каждой единицы оборудования. Критерии, послужившие
              основанием для выбора оборудования.
          - id: "3.4.2"
            title: "Перечень оборудования, количество и стоимость"
            kind: analysis
            inputs: [тэо_bfs, псд, смета, кп_поставщиков, финмодель]
            tools: [project_docs, calc]
            output_hints: {tables: ["Перечень оборудования: наименование, кол-во, характеристики, цена, сумма, источник цены, оценка обоснованности"]}
            requirement: >-
              Перечень выбранного оборудования с указанием количества единиц, технических характеристик,
              стоимости и др. показателей. Оценка обоснованности предусмотренного количества единиц и
              состава оборудования, его стоимости, адекватности технических характеристик и др.
          - id: "3.4.3"
            title: "Устройство и назначение оборудования"
            kind: analysis
            inputs: [тэо_bfs, кп_поставщиков]
            tools: [project_docs, web]
            requirement: >-
              Краткая информация об устройстве, функционировании оборудования, его назначении в
              технологическом процессе.
          - id: "3.4.4"
            title: "Соответствие оборудования сырью"
            kind: analysis
            tools: [project_docs, web]
            requirement: >-
              Оценка соответствия выбранного комплекта оборудования используемому сырью с целью получения
              качественной продукции.
          - id: "3.4.5"
            title: "Производительность и минимальная загрузка"
            kind: analysis
            tools: [project_docs, calc, web]
            output_hints: {tables: ["Баланс производительности по участкам vs заявленная мощность; технологический минимум загрузки"]}
            requirement: >-
              Оценка производительности каждого комплекта оборудования и соответствия уровней
              производительности каждого участка, а также соответствия заявленным мощностям.
              Технологически допустимый минимальный уровень загрузки, ниже которого работа оборудования
              технологически невозможна и линия/оборудование подлежит остановке.
          - id: "3.4.6"
            title: "Соответствие стандартам"
            kind: analysis
            tools: [project_docs, web, reference]
            requirement: >-
              Оценка выбранного оборудования на соответствие стандартам, применяемым в отрасли в регионе
              реализации проекта и на целевых рынках сбыта.
          - id: "3.4.7"
            title: "Затраты на поддержание оборудования (O&M, maintenance capex)"
            kind: analysis
            inputs: [финмодель, тэо_bfs]
            tools: [project_docs, calc, web]
            requirement: >-
              Оценка достаточности/недостаточности мероприятий и затрат, запланированных в течение
              жизненного цикла проекта для поддержания оборудования (текущий и капитальный ремонт,
              operating & maintenance, maintenance capex и т.д.).
          - id: "3.4.8"
            title: "Соответствие НДТ РК"
            kind: analysis
            tools: [reference, project_docs, web]
            requires_reference: [ndt]
            requirement: >-
              Анализ и оценка технологии и технологического оборудования в соответствии со справочниками
              наилучших доступных техник (НДТ) Республики Казахстан.
          - id: "3.4.9"
            title: "Инновационность, ноу-хау, стандарты качества"
            kind: analysis
            tools: [project_docs, web]
            requirement: >-
              Оценка применения инновационного оборудования, использования ноу-хау, использования
              проектом стандартов качества.
          - id: "3.4.10"
            title: "Существующее оборудование: износ и ресурс"
            kind: analysis
            conditional: "в проекте используется существующее оборудование"
            tools: [project_docs, calc]
            requirement: >-
              При использовании существующего оборудования — вывод о способности оборудования проработать
              проектный период, обоснованности инвестиций на поддержание работоспособности; оценка степени
              физического и морального износа всего комплекса оборудования.
          - id: "3.4.11"
            title: "Совместимость с действующим оборудованием"
            kind: analysis
            conditional: "в проекте есть действующее оборудование"
            tools: [project_docs]
            requirement: "Оценка технологической совместимости с уже используемым оборудованием."
          - id: "3.4.12"
            title: "Выводы по оборудованию"
            kind: conclusion
            depends_on: ["3.4.1", "3.4.2", "3.4.3", "3.4.4", "3.4.5", "3.4.6", "3.4.7", "3.4.8", "3.4.9", "3.4.10", "3.4.11"]
            requirement: >-
              Выводы о соответствии/несоответствии выбранного комплекта оборудования выбранной технологии
              производства и целевым проектным показателям.
          - id: "3.4.13"
            title: "Замечания, предложения, рекомендации"
            kind: remarks
            depends_on: ["3.4.1", "3.4.2", "3.4.3", "3.4.4", "3.4.5", "3.4.6", "3.4.7", "3.4.8", "3.4.9", "3.4.10", "3.4.11", "3.4.12"]
            requirement: "Замечания, предложения, рекомендации по данной части проекта."

      - id: "3.5"
        title: "Оценка сырья и материалов"
        expert_role: технолог
        items:
          - id: "3.5.1"
            title: "Расположение относительно источников сырья"
            kind: analysis
            inputs: [бизнес_план, тэо_bfs, договоры_поставки]
            tools: [project_docs, web, calc]
            requirement: "Анализ расположенности проекта относительно источников и поставщиков сырья."
          - id: "3.5.2"
            title: "Соответствие характеристик сырья технологии и оборудованию"
            kind: analysis
            tools: [project_docs, web]
            requirement: >-
              Анализ и оценка соответствия технических характеристик планируемого сырья с точки зрения
              применяемой технологии и комплекта оборудования.
          - id: "3.5.3"
            title: "Нормы потребления сырья, материалов, энергоресурсов"
            kind: analysis
            inputs: [тэо_bfs, финмодель]
            tools: [project_docs, calc, web, reference]
            output_hints: {tables: ["Нормы расхода: проект vs отраслевые/НДТ/аналоги, отклонение %"]}
            requirement: >-
              Оценка норм потребления сырья и материалов, энерго- и иных ресурсов согласно выбранному
              технологическому решению и оборудованию, производственной мощности и программе, целевым
              проектным показателям.
          - id: "3.5.4"
            title: "Логистика и достаточность запасов сырья"
            kind: analysis
            tools: [project_docs, web, calc]
            requirement: >-
              Оценка преимущества выбранного источника сырья с точки зрения логистики, достаточности
              объемов запасов (производства).
          - id: "3.5.5"
            title: "Подготовка сырья"
            kind: analysis
            tools: [project_docs, web]
            requirement: >-
              Информация о необходимости/отсутствии необходимости дополнительной подготовки сырья к
              использованию/переработке.
          - id: "3.5.6"
            title: "Выводы по сырью"
            kind: conclusion
            depends_on: ["3.5.1", "3.5.2", "3.5.3", "3.5.4", "3.5.5"]
            requirement: >-
              Выводы о целесообразности/нецелесообразности использования в проекте данного качества
              сырья в сравнении с имеющимися аналогами.
          - id: "3.5.7"
            title: "Замечания, предложения, рекомендации"
            kind: remarks
            depends_on: ["3.5.1", "3.5.2", "3.5.3", "3.5.4", "3.5.5", "3.5.6"]
            requirement: "Замечания, предложения, рекомендации по данной части проекта."

      - id: "3.6"
        title: "Оценка проработки закупок и стоимости проекта"
        enabled: false          # в эталоне раздел отсутствует; включается флагом проекта
        extension: true
        expert_role: сметчик_закупки
        items:
          - id: "3.6.1"
            title: "Обоснованность заявленной стоимости проекта"
            kind: analysis
            inputs: [смета, финмодель, кп_поставщиков, договоры_поставки, тэо_bfs]
            tools: [project_docs, web, calc]
            output_hints: {tables: ["CAPEX по статьям: заявлено vs обосновано источником vs рыночный ориентир, отклонение"]}
            requirement: >-
              Оценка заявленной стоимости проекта (бюджета) по статьям: наличие подтверждающих КП/смет,
              актуальность цен, резерв на непредвиденные расходы, курсовые допущения.
          - id: "3.6.2"
            title: "Закупочные процедуры и договоры"
            kind: analysis
            inputs: [закупочные_процедуры, договоры_поставки, кп_поставщиков]
            tools: [project_docs]
            requirement: >-
              Оценка закупочных процедур Заявителя, выбора поставщиков, условий заключённых и
              подготовленных договоров (сроки, гарантии, шеф-монтаж, ПНР, штрафы, условия оплаты).

      - id: "3.7"
        title: "Оценка экологической проработки проекта"
        expert_role: эколог
        items:
          - id: "3.7.1"
            title: "Обоснованность природоохранных решений"
            kind: analysis
            inputs: [экология, тэо_bfs, псд]
            tools: [project_docs, reference, web]
            requirement: >-
              Оценка обоснованности решений по снижению воздействия проекта на окружающую среду с учетом
              экологических требований/стандартов в регионе реализации и на целевых рынках сбыта.
          - id: "3.7.2"
            title: "Воздействие на окружающую среду, источники загрязнения"
            kind: analysis
            tools: [project_docs, reference]
            output_hints: {tables: ["Источники загрязнения: вид, загрязнители, объём, меры"]}
            requirement: >-
              Разъясняющая информация о возможном воздействии проекта на окружающую среду; основные
              источники загрязнения.
          - id: "3.7.3"
            title: "Достаточность мероприятий и затрат"
            kind: analysis
            inputs: [экология, смета, финмодель]
            tools: [project_docs, calc]
            requirement: >-
              Анализ достаточности работ и мероприятий по уменьшению вредного воздействия на окружающую
              среду, а также достаточности заложенных затрат на экологически безопасную деятельность.
          - id: "3.7.4"
            title: "Документальная проработка (заключения, разрешения)"
            kind: analysis
            inputs: [экология, псд]
            tools: [project_docs, reference]
            output_hints: {tables: ["Требуемые документы (ОВОС, заключение экспертизы, разрешение на эмиссии и т.д.): наличие, реквизиты, срок"]}
            requirement: >-
              Анализ документальной проработки проекта в экологической части. Наличие необходимых
              заключений.
          - id: "3.7.5"
            title: "Возможные штрафы"
            kind: analysis
            tools: [reference, web, calc]
            requires_reference: [law]
            requirement: >-
              Анализ возможных административных расходов (штрафы) при нарушении экологических норм.
          - id: "3.7.6"
            title: "Выводы по экологии"
            kind: conclusion
            depends_on: ["3.7.1", "3.7.2", "3.7.3", "3.7.4", "3.7.5"]
            requirement: "Выводы о возможности/невозможности реализации проекта с экологической точки зрения."
          - id: "3.7.7"
            title: "Замечания, предложения, рекомендации"
            kind: remarks
            depends_on: ["3.7.1", "3.7.2", "3.7.3", "3.7.4", "3.7.5", "3.7.6"]
            requirement: "Замечания, предложения, рекомендации по данной части проекта."

  - id: "4"
    title: "Проектные риски"
    kind: risks
    depends_on: ["3.*"]
    requirement: >-
      Выявить основные проектные риски по технической части и закупкам, отразить степень их влияния.
      Степень по каждому риску — с аргументированным объяснением; по каждому риску — мероприятия по
      управлению, снижению и устранению.
    probability_scale:
      1: "Низкая"
      2: "От низкой до умеренной"
      3: "Умеренная"
      4: "От умеренной до высокой"
      5: "Высокая"
    impact_scale:
      1: "Не значительный"
      2: "Средний"
      3: "Большой"
    zones:                       # для тепловой карты и интегрального уровня
      red:    "p*i >= 10 or (p >= 4 and i == 3)"
      yellow: "p*i >= 5"
      green:  "otherwise"
    mandatory_risks:
      - {code: "T1",  group: "4.1", related: ["3.2.*"], title: "Риск несоответствия выбранного региона размещения и площадки целевым показателям проекта"}
      - {code: "T2",  group: "4.1", related: ["3.3.*"], title: "Риск несоответствия выбранной технологии производства целевым проектным показателям или приоритетам Банка"}
      - {code: "T3",  group: "4.1", related: ["3.4.*"], title: "Риск несоответствия выбранного комплекта оборудования технологии производства, целевым проектным показателям или приоритетам Банка"}
      - {code: "T4",  group: "4.1", related: ["3.3.2", "3.4.5"], title: "Риск недостижения заявленной производственной мощности, производственной программы, производительности, качества"}
      - {code: "T5",  group: "4.1", related: ["3.5.*"], title: "Риск необеспеченности сырьём в достаточном объёме и необходимом качестве"}
      - {code: "T6",  group: "4.1", related: ["3.1.5"], title: "Риск несоответствия подходов к разработке ПСД нормативным документам и требованиям Банка"}
      - {code: "T7",  group: "4.1", related: ["3.2.*", "3.4.10", "3.4.11"], title: "Риск несоответствия существующих производственных и вспомогательных помещений, инженерных коммуникаций потребностям проекта"}
      - {code: "T8",  group: "4.1", related: ["3.2.*"], title: "Риск несоответствия проектируемых производственных и вспомогательных помещений, инженерных коммуникаций потребностям проекта"}
      - {code: "T9",  group: "4.1", related: ["3.7.*"], title: "Риск дополнительных расходов и проблем, связанных с воздействием проекта на окружающую среду"}
      - {code: "T10", group: "4.1", related: ["3.6.*"], title: "Риск несоблюдения сроков исполнения Плана инвестиционной фазы проекта"}
      - {code: "T11", group: "4.1", related: ["3.2.3"], title: "Риск необеспеченности квалифицированными трудовыми техническими/производственными ресурсами"}
      - {code: "P1",  group: "4.2", related: ["3.6.2"], title: "Риск несоответствия процедур закупок и подразделений Заявителя, занимающихся закупками, требованиям проекта"}
      - {code: "P2",  group: "4.2", related: ["3.4.1", "3.6.2"], title: "Риск несоответствия выбора поставщиков потребностям проекта, целевым показателям"}
      - {code: "P3",  group: "4.2", related: ["3.6.2"], title: "Риск несоответствия заключённых или подготовленных соглашений потребностям проекта и требованиям Банка"}
      - {code: "P4",  group: "4.2", related: ["3.4.2", "3.6.1"], title: "Риск дополнительных расходов в ходе реализации проекта (удорожание)"}

  - id: "5"
    title: "Выводы"
    kind: conclusion
    depends_on: ["3.*", "4"]
    requirement: >-
      Выводы по проекту на предмет достаточности проработки документальной части в различных его частях,
      обоснованности заявленной стоимости проекта и возможности его осуществления. Перечень нераскрытых
      пунктов ТЗ с причинами, анализом влияния на выводы, допущениями, рисками и рекомендациями.

  - id: "6"
    title: "Требования к качеству оценки и полноценности предоставления информации"
    kind: info
    render: quality_declaration
    requirement: >-
      Декларация соответствия: независимость (отсутствие конфликта интересов по п. 6.4), ссылки на
      источники, раскрытие всех пунктов ТЗ, аргументированность выводов.

validation_rules:
  - every_item_present
  - sourced_unless_not_disclosed          # full/partial → ≥1 source
  - gap_fields_required_when_not_disclosed # reason, impact_on_conclusions, assumptions, recommendation
  - min_alternatives_3_4_1
  - mandatory_risks_scored_with_rationale_and_mitigation
  - all_items_expert_approved
  - independence_block_completed
  - web_sources_have_url_and_access_date

appendices:
  - {id: "А", title: "Список использованных источников", render: sources}
  - {id: "Б", title: "Матрица покрытия пунктов технического задания", render: coverage}
  - {id: "В", title: "Резюме экспертов", render: expert_cvs}
  - {id: "Г", title: "Сравнительные таблицы оборудования", render: equipment_tables, optional: true}
