# Постоянные тексты отчёта (не формулировки пунктов ТЗ — те только из YAML шаблона).
# Переменные — $имя (string.Template).

title:
  approve: "УТВЕРЖДАЮ"
  approve_role: "Руководитель экспертной группы"
  report_word: "ОТЧЁТ"
  subtitle: "об оценке технической проработанности и закупок инвестиционного проекта"
  customer: "Заказчик"
  executor: "Исполнитель"
  version: "Версия"
  draft_mark: "ЧЕРНОВИК — не утверждён экспертами, не для передачи в банк"
  signature: "____________"
  date_blank: "«___» ____________ $year г."

executors_heading: "СПИСОК ИСПОЛНИТЕЛЕЙ"
executors_columns: ["ФИО", "Роль в проекте", "Специализация", "Разделы отчёта", "Подпись"]
executors_empty: "Команда экспертов проекта не сформирована (вкладка «Команда» проекта)."
roles: {lead: "Руководитель экспертной группы", expert: "Эксперт"}

toc_heading: "СОДЕРЖАНИЕ"
toc_hint: "Обновите поле: правая кнопка мыши → «Обновить поле»."

structure_intro: >-
  Отчёт подготовлен по типовым требованиям банка к оценке технической проработанности и закупок
  инвестиционного проекта. Нумерация разделов и пунктов отчёта соответствует техническому заданию
  банка; пункты, не применимые к проекту или не раскрытые из-за отсутствия исходных данных, приведены
  с указанием причины, влияния на выводы, принятых допущений и рекомендаций. Ссылки на источники
  даны в квадратных скобках по номеру в приложении А. Отчёт состоит из следующих разделов:

item:
  requirement: "Требование технического задания:"
  conclusion: "Вывод"
  remarks: "Замечания"
  recommendations: "Рекомендации"
  assumptions: "Принятые допущения"
  not_applicable: "Пункт не применим к проекту."
  gap_heading: "Пункт не раскрыт"
  gap_reason: "Причина"
  gap_impact: "Влияние на выводы"
  gap_assumptions: "Принятые допущения"
  gap_recommendation: "Рекомендация"
  not_ready: "Пункт не сформирован: $reason. Требуется довыполнение оценки или подготовка пункта экспертом."
  not_ready_default: "оценка пункта не выполнялась"
  table: "Таблица"

pending_section: >-
  Раздел ещё не сформирован: запустите оценку рисков и выводов (вкладка «Риски» проекта) после
  выполнения пунктов раздела 3.

zones: {red: "Высокий", yellow: "Средний", green: "Низкий"}
risks:
  integral: "Интегральный уровень риска проекта"
  integral_text: >-
    $level. Обязательных рисков оценено $scored из $total: в красной зоне — $red, в жёлтой — $yellow,
    в зелёной — $green. Уровень определяется по худшей зоне среди оценённых рисков (зоны — по правилам
    технического задания).
  columns: ["Риск", "Вероятность", "Влияние", "Уровень", "Обоснование", "Мероприятия по управлению"]
  table: "Реестр рисков: $group"
  extra_mark: "(дополнительный)"
  not_scored: "Риск не оценён"
  figure_word: "Рисунок"
  heatmap: "Тепловая карта проектных рисков"

quality_declaration: >-
  Исполнитель ($executor) подтверждает, что оценка выполнена независимо: аффилированность Исполнителя
  с Заказчиком — $affiliated; участие Исполнителя в разработке документации проекта — $participated;
  Исполнитель является поставщиком по проекту — $supplier. Каждый вывод отчёта сопровождается
  аргументацией и ссылкой на источник (документ и страницу, лист и ячейки, либо адрес ресурса и дату
  обращения). Все пункты технического задания приведены в отчёте; нераскрытые пункты содержат причину,
  влияние на выводы, принятые допущения и рекомендации. Выводы подготовлены и проверены экспертами,
  указанными в списке исполнителей.
yes_no: {"true": "да", "false": "нет", "none": "не указано"}

appendix_word: "ПРИЛОЖЕНИЕ"
appendix_kind: "(обязательное)"
sources_empty: "Источники не использованы."
coverage_columns: ["Пункт", "Наименование", "Статус раскрытия", "Источников", "Эксперт", "Утверждён"]
coverage_approved: {"true": "да", "false": "нет"}
cvs_columns: ["ФИО", "Специализация", "Образование", "Исследовательский опыт", "Стаж, лет"]
cvs_note: "Резюме экспертов прилагаются к пакету отчёта отдельными файлами."
equipment_note: "Сравнительные таблицы оборудования приведены в пунктах раздела 3.4."

disclosure:
  full: "Раскрыт"
  partial: "Раскрыт частично"
  not_disclosed: "Не раскрыт"
  not_applicable: "Не применим"
  missing: "Не сформирован"

footer_draft: "Черновик v$version от $date — не утверждён экспертами"
footer_released: "Версия $version от $date · $hash"
page_of_total: "Стр. $page из $total"
