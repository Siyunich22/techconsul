# Правила автоклассификации документов (не содержание ТЗ банка, а настройки классификатора).
# Набор категорий берётся из шаблона ТЗ (document_categories); правила для категорий,
# которых нет в шаблоне проекта, игнорируются. Нет правила → категорию определяет LLM.
#
# filename — регулярные выражения по имени файла и пути в папке/архиве (без учёта регистра), вес 3;
# content  — фразы в первых страницах текста, вес 1 за фразу (не более 4 на категорию);
# sheets   — названия листов книги Excel, вес 2.

договор_услуг:
  filename: ['договор.{0,20}(оказани|услуг)', '(техническ|независим).{0,10}(оценк|экспертиз)']
  content: ['договор на оказание услуг', 'исполнитель обязуется', 'техническое задание на оказание услуг',
            'стоимость услуг', 'предмет договора']
бизнес_план:
  filename: ['бизнес.?план', '(^|[^a-zа-я])бп([^a-zа-я]|$)', 'business.?plan']
  content: ['бизнес-план', 'резюме проекта', 'маркетинговый план', 'анализ рынка', 'swot']
тэо_bfs:
  filename: ['(^|[^a-zа-я])тэо([^a-zа-я]|$)', 'технико.?экономическ', 'feasibility', '(^|[^a-z])(bfs|dfs)([^a-z]|$)']
  content: ['технико-экономическое обоснование', 'feasibility study', 'технологические решения',
            'генеральный план', 'основное технологическое оборудование', 'производственная мощность']
псд:
  filename: ['(^|[^a-zа-я])псд([^a-zа-я]|$)', 'проектн.{0,5}сметн', 'рабочий проект', 'рабоч.{0,5}документац',
             '(^|[^a-zа-я])(рп|пз)([^a-zа-я]|$)', 'пояснительная записка']
  content: ['проектно-сметная документация', 'пояснительная записка', 'рабочий проект', 'стадия «рп»',
            'стадия рп', 'шифр проекта']
смета:
  filename: ['смет', 'ссср', '(^|[^a-zа-я])ср([^a-zа-я]|$)', 'расчет стоимости строительства']
  content: ['сводный сметный расчет', 'локальная смета', 'объектная смета', 'сметная стоимость',
            'итого по смете']
финмодель:
  filename: ['фин.{0,5}модел', 'financial.?model', '(^|[^a-z])fm([^a-z]|$)', 'денежн.{0,5}поток']
  content: ['npv', 'irr', 'денежный поток', 'дисконтирован', 'срок окупаемости']
  sheets: ['capex', 'opex', 'cash ?flow', 'денежн', 'производств', 'кредит', 'p&l', 'инвестиц']
кп_поставщиков:
  filename: ['(^|[^a-zа-я])кп([^a-zа-я]|$)', 'коммерческ.{0,5}предложен', 'quotation', '(^|[^a-z])offer', 'proposal', 'прайс']
  content: ['коммерческое предложение', 'срок действия предложения', 'условия поставки', 'incoterms',
            'quotation', 'цена за единицу']
договоры_поставки:
  filename: ['договор.{0,20}постав', 'контракт', 'contract', 'договор.{0,20}подряд', 'спецификац']
  content: ['договор поставки', 'поставщик обязуется', 'договор подряда', 'покупатель обязуется', 'спецификация №']
техусловия:
  filename: ['(^|[^a-zа-я])ту([^a-zа-я]|$)', 'техническ.{0,5}услови', 'технические условия']
  content: ['технические условия', 'на подключение', 'точка подключения', 'разрешенная мощность',
            'присоединение к', 'выдаются']
экология:
  filename: ['овос', 'экологи', 'эколог', 'эмисси', '(^|[^a-zа-я])пдв([^a-zа-я]|$)', 'esia', 'eia']
  content: ['оценка воздействия на окружающую среду', 'экологическое разрешение', 'выбросы загрязняющих веществ',
            'заключение государственной экологической экспертизы', 'класс опасности', 'санитарно-защитная зона']
правоустанавливающие:
  filename: ['акт.{0,10}(земел|участ)', 'земельн', 'кадастр', 'гос.?акт', 'право.{0,5}собственн', 'аренд.{0,10}земл']
  content: ['государственный акт на право', 'кадастровый номер', 'земельный участок', 'право временного',
            'целевое назначение', 'площадь участка']
закупочные_процедуры:
  filename: ['закуп', 'тендер', 'конкурс', 'протокол.{0,20}(итог|вскрыт)', 'procurement']
  content: ['правила закупок', 'протокол об итогах', 'тендерная документация', 'способ закупки',
            'потенциальный поставщик', 'конкурсная комиссия']
