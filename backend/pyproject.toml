[project]
name = "techocenka-backend"
version = "0.1.0"
description = "ТехОценка — backend API и конвейер обработки"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "boto3>=1.35",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: тесты с реальным Anthropic API (запуск только при RUN_LIVE_LLM=1)",
    "integration: тесты, требующие поднятых Postgres/Redis/MinIO",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
